
<div class="unlock-screen">
  <p-card>
      <h1>Prepora заблокировано</h1>

      @if (hasPin()) {
        <!-- Режим ПИН -->
        <input #pinInput
               type="password"
               inputmode="numeric"
               maxlength="6"
               placeholder="Введите ПИН"
               (input)="onPinInput($event)" />
               <br />
        <p-button (click)="switchToPassword()">Ввести пароль</p-button>
      } @else {
        <!-- Режим пароля -->
        <form [formGroup]="form" (ngSubmit)="unlockWithPassword()" class="p-card-content">
          <input formControlName="password"
                 type="password"
                 placeholder="Мастер-пароль" />
          <p-button type="submit" [disabled]="loading()">
            {{ loading() ? 'Проверка...' : 'Войти' }}
          </p-button>
        </form>
      }

      @if (error()) {
        <p class="error">{{ error() }}</p>
      }
  </p-card>          
</div>
