    <div class="unlock-screen">
      <h1>Prepora заблокировано</h1>

      @if (hasPin()) {
        <!-- Режим ПИН -->
        <input #pinInput
               type="password"
               inputmode="numeric"
               maxlength="6"
               placeholder="Введите ПИН"
               (input)="onPinInput($event)" />
        <button (click)="switchToPassword()">Ввести пароль</button>
      } @else {
        <!-- Режим пароля -->
        <form [formGroup]="form" (ngSubmit)="unlockWithPassword()">
          <input formControlName="password"
                 type="password"
                 placeholder="Мастер-пароль" />
          <button type="submit" [disabled]="loading()">
            {{ loading() ? 'Проверка...' : 'Войти' }}
          </button>
        </form>
      }

      @if (error()) {
        <p class="error">{{ error() }}</p>
      }
    </div>
