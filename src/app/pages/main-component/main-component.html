<div
    style="background: rgb(17, 24, 39); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0px; z-index: 50;">
    <div style="display: flex; align-items: center; gap: 10px;">
        <div
            style="width: 34px; height: 34px; background: rgb(249, 115, 22); border-radius: 9px; display: flex; align-items: center; justify-content: center; font-family: &quot;Playfair Display&quot;, serif; font-weight: 900; color: rgb(255, 255, 255); font-size: 17px;">
            п</div>
        <div>
            <div
                style="font-family: &quot;Playfair Display&quot;, serif; font-weight: 900; color: rgb(255, 255, 255); font-size: 16px;">
                {{ 'app.name' | translate }}</div>
            <div style="font-size: 9px; color: rgb(107, 114, 128); letter-spacing: 0.08em; font-weight: 700;">{{ 'app.title' | translate }}</div>
        </div>
    </div>
    <div
        style="background: rgb(249, 115, 22); color: rgb(255, 255, 255); font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 6px; letter-spacing: 0.06em;">
        БЕТА</div>
</div>

<div>
            <p-tabs [(value)]="activeTab" style="padding: 12px 14px; font-size: 12px; font-weight: 800; letter-spacing: 0.03em; white-space: nowrap; color: rgb(156, 163, 175); border: none; background: none;">
                <p-tablist>

                    @for (tab of tabs(); track tab.route) {
                        <p-tab [routerLink]="tab.route" [value]="tab.route" class="flex items-center !gap-2 text-inherit">
                            <i [class]="tab.icon"></i>
                            <span>{{ tab.label }}</span>
                        </p-tab>
                    }
                </p-tablist>
            </p-tabs>
            <router-outlet></router-outlet>
        </div>
