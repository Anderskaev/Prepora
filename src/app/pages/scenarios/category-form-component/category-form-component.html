
<div class="flex flex-col gap-4">

  <!-- Существующие категории -->
  @if (categories().length > 0) {
    <div class="flex flex-col gap-2">
      <span class="text-xs font-bold uppercase tracking-wider text-surface-400">
        {{ 'categories.existing' | translate }}
      </span>
      @for (cat of categories(); track cat.id) {
        <div class="card" style="margin: 1px; padding-left: 5px; border-radius: 5px;"
          [style.background-color]="cat.color + '80'">
          <div class="flex items-center gap-2">
            <span
              class="w-3 h-3 rounded-full flex-shrink-0"
              [style.background]="cat.color">
            </span>
            <span>{{ cat.icon }}</span>
            <span class="text-sm">{{ cat.label }}</span>
          <p-button
            icon="pi pi-trash"
            [text]="true"
            severity="danger"
            size="small"
            (onClick)="delete(cat.id)" />
          </div>
        </div>
      }
    </div>
  }
<hr/>

  <!-- Добавить новую -->
  <div class="flex flex-col gap-3 pt-2 border-t border-surface-200
              dark:border-surface-700">
    <span class="text-xs font-bold uppercase tracking-wider text-surface-400">
      {{ 'categories.add_new' | translate }}
    </span>

    <!-- Иконка + название -->
    <div class="flex gap-2">
      <input
        pInputText
        [(ngModel)]="newIcon"
        class="w-12 text-center text-xl"
        maxlength="2" />
      <input
        pInputText
        [(ngModel)]="newLabel"
        [placeholder]="'categories.name_placeholder' | translate"
        class="flex-1" />
    </div>

    <!-- Выбор цвета -->
    <div class="flex gap-2 flex-wrap">
      @for (color of colors; track color) {
        <button
          class="w-7 h-7 rounded-full border-2 transition-all"
          [style.background]="color"
          [class.border-white]="newColor() === color"
          [class.border-transparent]="newColor() !== color"
          [class.scale-110]="newColor() === color"
          [style]="newColor() == color ? 'border: 4px solid; margin: 2px; padding: 10px':'margin: 2px; padding: 10px'"
          (click)="newColor.set(color)">
        </button>
      }
    </div>

    <p-button
      [label]="'categories.add' | translate"
      icon="pi pi-plus"
      [disabled]="!isValid()"
      (onClick)="add()"
      styleClass="w-full" />
  </div>

  <!-- Закрыть -->
  <p-button
    [label]="'form.close' | translate"
    severity="secondary"
    [text]="true"
    (onClick)="closed.emit()"
    styleClass="w-full" />

</div>
