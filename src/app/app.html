    @switch (state()) {
      @case ('loading') {
        <div class="loading-screen">
          <span>Загрузка...</span>
        </div>
      }
      @case ('setup') {
        <app-setup-component (completed)="onSetupComplete()" />
      }
      @case ('unlock') {
        <app-unlock-component (unlocked)="onUnlocked()" />
      }
      @case ('ready') {
        <app-main-component [activeTab]="activeTab"/>
      }
    }
