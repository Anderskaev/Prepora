<h1>Препора</h1>
<p>Семейный антикризисный план</p>

<div class="card">
            <p-tabs [value]="''">
                <p-tablist>
                    @for (tab of tabs; track tab.route) {
                        <p-tab [routerLink]="tab.route" [value]="tab.route" class="flex items-center !gap-2 text-inherit">
                            <i [class]="tab.icon"></i>
                            <span>{{ tab.label }}</span>
                        </p-tab>
                    }
                </p-tablist>
            </p-tabs>
            <router-outlet></router-outlet>
        </div>
