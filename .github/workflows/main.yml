name: Build and deploy
on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
   runs-on: uubuntu-latest
   steps:
     - name: Check
       uses: actions/checkout@v4

     - name: Setup Node.js
       uses: actions/setup-node@v4
       with:
          node-version: '20'  # Use a version compatible with your Angular app
          cache: 'npm'

     - name: Install Dependencies
       run: npm ci
